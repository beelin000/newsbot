name: Auto-merge newsbot PRs

# Lands trusted newsbot briefing PRs onto main automatically.
# SECURITY: only same-repo PRs opened by allowlisted actors (repo owner /
# beelin000, or Cursor's GitHub App). External/fork PRs are never auto-merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: newsbot-automerge-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  actions: write

jobs:
  merge:
    # Fail closed: same repo, into main, newsbot branch prefix, trusted author.
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.head_ref, 'cursor/chinese-news-brief') ||
        startsWith(github.head_ref, 'cursor/chinese-global-news-brief') ||
        startsWith(github.head_ref, 'cursor/global-brief-file-management')
      ) &&
      (
        github.event.pull_request.user.login == 'beelin000' ||
        github.event.pull_request.user.login == 'cursor[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted actor (fail closed)
        env:
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          echo "PR author=${PR_USER} type=${PR_USER_TYPE} association=${ASSOCIATION}"
          echo "actor=${ACTOR} head=${HEAD_REPO} base=${BASE_REPO}"

          if [[ "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            echo "::error::Refusing auto-merge: PR head is not the same repository (forks blocked)."
            exit 1
          fi

          case "${PR_USER}" in
            beelin000|cursor\[bot\])
              echo "Author allowlisted."
              ;;
            *)
              echo "::error::Refusing auto-merge: author '${PR_USER}' is not allowlisted (beelin000|cursor[bot])."
              exit 1
              ;;
          esac

          # Triggering actor must also be trusted (blocks unexpected re-runs by others).
          case "${ACTOR}" in
            beelin000|cursor\[bot\]|github-actions\[bot\])
              echo "Trigger actor allowlisted."
              ;;
            *)
              echo "::error::Refusing auto-merge: github.actor '${ACTOR}' is not allowlisted."
              exit 1
              ;;
          esac

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"

      - name: Land briefing files and rebuild site
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Newsletter .md paths landed this run — used to trigger email after push.
          # (GITHUB_TOKEN pushes do not fire other workflows' on.push handlers.)
          LANDED_MDS=()

          # Apply newsletter (+ supporting script/workflow/docs) changes from the PR.
          # Parse -z --name-status so renames emit OLD + NEW paths (plain --name-only
          # only lists the destination, leaving orphan sources on main).
          land_path() {
            local f="$1"
            f="${f#\"}"
            f="${f%\"}"
            case "$f" in
              newsletters/*|scripts/*|README.md|.github/workflows/*)
                if git cat-file -e "pr-head:$f" 2>/dev/null; then
                  mkdir -p "$(dirname "$f")"
                  git checkout pr-head -- "$f"
                  echo "landed $f"
                  if [[ "$f" == newsletters/*.md ]]; then
                    LANDED_MDS+=("$f")
                  fi
                  return 0
                elif git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                  git rm -f -- "$f"
                  echo "removed $f"
                  return 0
                else
                  echo "skip missing $f"
                  return 0
                fi
                ;;
              index.html|archive.html|editions.json)
                echo "skip generated Pages index (will rebuild): $f"
                return 0
                ;;
              *)
                echo "skip other path from PR: $f"
                return 0
                ;;
            esac
          }

          mapfile -d '' -t STATUS_ENTRIES < <(git diff -z --name-status -M origin/main...pr-head)
          i=0
          n=${#STATUS_ENTRIES[@]}
          while (( i < n )); do
            status="${STATUS_ENTRIES[i]}"
            ((i++)) || true
            case "$status" in
              R*|C*)
                # rename/copy: oldpath, newpath
                old="${STATUS_ENTRIES[i]:-}"
                ((i++)) || true
                new="${STATUS_ENTRIES[i]:-}"
                ((i++)) || true
                # Drop the old path on main, then land the new one.
                if [[ -n "$old" ]]; then
                  case "$old" in
                    newsletters/*|scripts/*|README.md|.github/workflows/*)
                      if git ls-files --error-unmatch -- "$old" >/dev/null 2>&1; then
                        git rm -f -- "$old"
                        echo "removed renamed-away $old"
                      fi
                      ;;
                  esac
                fi
                if [[ -n "$new" ]]; then
                  land_path "$new"
                fi
                ;;
              A*|M*|T*|D*)
                path="${STATUS_ENTRIES[i]:-}"
                ((i++)) || true
                if [[ -n "$path" ]]; then
                  land_path "$path"
                fi
                ;;
              *)
                echo "skip unknown status entry: $status"
                # Best-effort: if next looks like a path, consume it.
                if (( i < n )) && [[ "${STATUS_ENTRIES[i]}" == */* || "${STATUS_ENTRIES[i]}" == *.* ]]; then
                  ((i++)) || true
                fi
                ;;
            esac
          done

          python3 scripts/build_site.py

          if git diff --quiet && git diff --cached --quiet; then
            echo "No file changes after land/rebuild."
          else
            git add -A
            git commit -m "Auto-land PR #${PR} (${HEAD_REF}) and refresh Pages index."
            git push origin main
          fi

          # Persist whether any briefing .md landed (email step sends only --latest once).
          {
            for f in "${LANDED_MDS[@]+"${LANDED_MDS[@]}"}"; do
              printf '%s\n' "$f"
            done
          } | awk 'NF && !seen[$0]++' > /tmp/newsbot-email-mds.txt
          echo "Landed briefing .md files this run:"
          cat /tmp/newsbot-email-mds.txt || true

      - name: Trigger email workflow for latest briefing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/newsbot-email-mds.txt ]]; then
            echo "No briefing .md landed; skipping email."
            exit 0
          fi
          # One email per auto-land: newest edition on main (--latest).
          # Do not loop catch-up paths — that re-sent older editions every run.
          # workflow_dispatch IS allowed with GITHUB_TOKEN (unlike on.push from the same token).
          echo "Dispatching Email new briefings once (--latest)"
          gh workflow run "Email new briefings" --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Mark ready and close as merged when possible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Draft → ready (ignore if already ready)
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          # Prefer a real GitHub merge so the PR shows as MERGED.
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
            echo "Merged via gh pr merge"
            exit 0
          fi

          # If branch is already reflected on main (land push) but merge conflicts
          # on generated files, close with a note and delete the head branch.
          echo "gh pr merge failed; closing after land-to-main."
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" \
            --comment "Auto-landed onto main (newsletter files + regenerated site index). Closed because a direct merge would conflict on generated Pages files." \
            || true
          HEAD_REF="${{ github.head_ref }}"
          git push origin --delete "$HEAD_REF" 2>/dev/null || true

  pages:
    needs: merge
    if: needs.merge.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build static site
        run: |
          python3 scripts/build_site.py
          mkdir -p _site
          cp index.html archive.html editions.json .nojekyll _site/
          cp -r newsletters _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
