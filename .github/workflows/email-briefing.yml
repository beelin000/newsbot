name: Email new briefings

# When new global-brief-*.md files land on main, email them to BRIEFING_EMAIL_TO
# via SMTP secrets. Skips quietly if secrets are not configured.

on:
  push:
    branches: [main]
    paths:
      - "newsletters/**/*.md"
      - "newsletters/*.md"
  workflow_dispatch:
    inputs:
      briefing_path:
        description: "Optional path to a briefing .md. Leave empty to email the latest edition."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: email-briefing
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check email secrets
        id: cfg
        env:
          BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL_TO || vars.BRIEFING_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BRIEFING_EMAIL_TO}" || -z "${SMTP_HOST}" || -z "${SMTP_USER}" || -z "${SMTP_PASSWORD}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email secrets/vars not fully set; skipping send. See README § Email delivery."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send briefing email(s)
        if: steps.cfg.outputs.configured == 'true'
        env:
          BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL_TO || vars.BRIEFING_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || vars.SMTP_FROM || secrets.SMTP_USER }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS || '1' }}
          BRIEFING_PAGES_BASE: ${{ vars.BRIEFING_PAGES_BASE || 'https://beelin000.github.io/newsbot' }}
        run: |
          set -euo pipefail
          INPUT_PATH="${{ github.event.inputs.briefing_path || '' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${INPUT_PATH}" ]]; then
              python3 scripts/email_briefing.py "${INPUT_PATH}"
            else
              echo "No briefing_path input; sending latest edition."
              python3 scripts/email_briefing.py --latest
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            # If this push added any briefing .md, email only the newest edition once.
            if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              mapfile -t ADDED < <(
                git diff-tree --no-commit-id --name-only -r --diff-filter=A "${AFTER}" \
                  | grep -E '^newsletters/(.*/)?global-brief-.+\.md$' || true
              )
            else
              mapfile -t ADDED < <(
                git diff --name-only --diff-filter=A "${BEFORE}...${AFTER}" \
                  | grep -E '^newsletters/(.*/)?global-brief-.+\.md$' || true
              )
            fi
            if [[ ${#ADDED[@]} -eq 0 ]]; then
              echo "No new briefing Markdown in this push."
            else
              echo "New briefing(s) in push:"
              printf '  %s\n' "${ADDED[@]}"
              echo "Sending newest edition only (--latest)."
              python3 scripts/email_briefing.py --latest
            fi
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi
